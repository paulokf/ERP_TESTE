services:
  postgres:
    image: postgres:16-alpine
    container_name: clinicore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinicore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ophtha_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinicore"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clinicore_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ophtha_net

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: clinicore_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/clinicore
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=supersecretkeyclinicore2026
      - ALGORITHM=HS256
    volumes:
      - ./backend:/app
      - reports_storage:/app/storage/reports
    networks:
      - ophtha_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: clinicore_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    networks:
      - ophtha_net
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  reports_storage:

# UNIFICAÇÃO DA REDE VIRTUAL
networks:
  ophtha_net:
    name: ophtha_erp_bridge
    driver: bridge
